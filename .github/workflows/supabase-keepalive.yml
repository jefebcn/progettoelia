# Evita che il progetto Supabase (piano Free) vada in pausa per inattività.
# Supabase mette in pausa i progetti gratuiti dopo ~7 giorni senza richieste:
# a quel punto l'app non carica più gli orari (è il guasto visto sul sito).
#
# Configurazione (una volta sola) su GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL       = https://xxxx.supabase.co
#     SUPABASE_ANON_KEY  = la anon / publishable key
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */2 * *" # ogni 2 giorni alle 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_ANON_KEY mancanti"; exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/slots?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ha risposto $code — il progetto potrebbe essere in pausa. Ripristinalo dalla dashboard."
            exit 1
          fi
