<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>progettoelia</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0b1020;
        color: #f4f6fb;
        text-align: center;
        padding: 2rem;
      }
      .card {
        max-width: 32rem;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3.5rem);
        margin: 0 0 0.5rem;
      }
      p {
        opacity: 0.75;
        line-height: 1.6;
        margin: 0.5rem 0;
      }
      .badge {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>progettoelia</h1>
      <p>Progetto attivo, deploy automatico su Vercel.</p>
      <p>Ogni push su GitHub pubblica in automatico una nuova versione.</p>
      <span class="badge">🚀 Deployed with Vercel</span>
    </main>
  </body>
</html>
